name: Cron CI Monitor

on:
  workflow_dispatch:
    inputs:
      hours_back:
        description: 'Hours to look back for failures'
        required: false
        default: '24'
      workflows:
        description: 'Comma-separated workflow files to monitor (empty = all defaults)'
        required: false
        default: ''
      output_mode:
        description: 'Output mode'
        required: false
        default: 'daily-issue'
        type: choice
        options:
          - daily-issue
          - stdout
      reset_state:
        description: 'Reset state to force re-analysis of all jobs'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ci-monitor
  cancel-in-progress: false

env:
  DEFAULT_WORKFLOWS: |
    nightly-test-amd.yml
    nightly-test-amd-rocm720.yml
    release-docker-amd-nightly.yml
    release-docker-amd-rocm720-nightly.yml
    nightly-amd-mi355x-disagg.yml
    amd-aiter-scout.yml
    pr-test-amd.yml
    pr-test-amd-rocm720.yml

jobs:
  prepare:
    runs-on: [self-hosted, amd-internal]
    permissions:
      issues: write
      contents: read
    outputs:
      workflows: ${{ steps.resolve.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve workflow list
        id: resolve
        env:
          INPUT_WORKFLOWS: ${{ github.event.inputs.workflows }}
        run: |
          WF_JSON=$(python3 -c "
          import json, os
          raw = os.environ.get('INPUT_WORKFLOWS') or os.environ['DEFAULT_WORKFLOWS']
          seps = [',', '\n']
          for s in seps:
              raw = raw.replace(s, '\n')
          items = [x.strip() for x in raw.split('\n') if x.strip()]
          if any(not x.endswith(('.yml', '.yaml')) or '/' in x for x in items):
              raise SystemExit('workflow names must be basename .yml/.yaml files')
          print(json.dumps(items))
          ")
          echo "workflows=$WF_JSON" >> "$GITHUB_OUTPUT"
          echo "Resolved workflows: $WF_JSON"

      - name: Ensure daily issue exists
        env:
          BOT_REPO_TOKEN: ${{ github.token }}
          BOT_REPO: ${{ github.repository }}
        run: python scripts/ensure_daily_issue.py

  monitor:
    needs: prepare
    runs-on: [self-hosted, amd-internal]
    permissions:
      issues: write
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        workflow: ${{ fromJSON(needs.prepare.outputs.workflows) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Derive safe cache key
        id: cachekey
        env:
          WORKFLOW_FILE: ${{ matrix.workflow }}
        run: |
          SAFE=$(printf '%s' "$WORKFLOW_FILE" | tr '/.' '--')
          echo "key=$SAFE" >> "$GITHUB_OUTPUT"

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state/
          key: ci-monitor-state-${{ steps.cachekey.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            ci-monitor-state-${{ steps.cachekey.outputs.key }}-

      - name: Reset state
        if: ${{ github.event.inputs.reset_state == 'true' }}
        run: rm -rf .state/

      - name: Run CI Monitor for ${{ matrix.workflow }}
        env:
          SGLANG_PAT: ${{ secrets.GH_PAT }}
          BOT_REPO_TOKEN: ${{ github.token }}
          LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          USE_AGENT: 'false'
          HOURS_BACK: ${{ github.event.inputs.hours_back || '24' }}
          OUTPUT_MODE: ${{ github.event.inputs.output_mode || 'daily-issue' }}
          BOT_REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: ${{ matrix.workflow }}
        run: |
          args=(
            --hours-back "$HOURS_BACK"
            --output "$OUTPUT_MODE"
            --bot-repo "$BOT_REPOSITORY"
            --workflows "$WORKFLOW_FILE"
          )
          args+=(--no-use-agent)
          python scripts/monitor_ci.py "${args[@]}"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/
          key: ci-monitor-state-${{ steps.cachekey.outputs.key }}-${{ github.run_id }}

  finalize:
    needs: monitor
    if: always()
    runs-on: [self-hosted, amd-internal]
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update upstream Failure Trackers
        env:
          SGLANG_PAT: ${{ secrets.GH_PAT }}
          BOT_REPO_TOKEN: ${{ github.token }}
          LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          USE_AGENT: 'false'
          BOT_REPOSITORY: ${{ github.repository }}
        run: |
          args=(--bot-repo "$BOT_REPOSITORY" --no-use-agent)
          python scripts/failure_tracker.py "${args[@]}"
