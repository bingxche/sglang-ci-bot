name: Comment Watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      since_hours:
        description: 'Hours to look back for comments'
        required: false
        default: '1'

concurrency:
  group: comment-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: [self-hosted, amd-internal]
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state/
          key: comment-watcher-state-${{ github.run_id }}
          restore-keys: |
            comment-watcher-state-

      - name: Watch for commands
        env:
          SGLANG_PAT: ${{ secrets.GH_PAT }}
          BOT_REPO_TOKEN: ${{ github.token }}
          BOT_TRIGGER_LOGIN: amd-bot
          BOT_ACTOR_LOGIN: bingxche
          BOT_CLAIM_LOGINS: amd-bot,bingxche
          SINCE_HOURS: ${{ github.event.inputs.since_hours || '1' }}
          BOT_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/watch_comments.py \
            --bot-repo "$BOT_REPOSITORY" \
            --since-hours "$SINCE_HOURS"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/
          key: comment-watcher-state-${{ github.run_id }}
