name: CI Status Check

on:
  repository_dispatch:
    types: [ci-status]

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check CI status'
        required: true
        type: number
      comment_id:
        description: 'Source comment ID (watcher dispatch)'
        required: false
        default: ''
      comment_author:
        description: 'Source comment author (watcher dispatch)'
        required: false
        default: ''

concurrency:
  group: ci-status-${{ github.event.client_payload.comment_id || github.event.inputs.comment_id || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, amd-internal]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check CI Status
        env:
          SGLANG_PAT: ${{ secrets.GH_PAT }}
          LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number || github.event.inputs.pr_number }}
          COMMENT_AUTHOR: ${{ github.event.client_payload.comment_author || github.event.inputs.comment_author }}
          USE_AGENT: 'false'
          AGENT_WORKSPACE: /workspace
        run: python scripts/check_ci_for_pr.py "$PR_NUMBER" --no-use-agent
