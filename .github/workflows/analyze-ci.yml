name: Analyze CI

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'GitHub Actions run or job URL to analyze'
        required: true
        type: string

concurrency:
  group: analyze-ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: [self-hosted, amd-internal]
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        env:
          SGLANG_PAT: ${{ secrets.GH_PAT }}
          BOT_REPO_TOKEN: ${{ github.token }}
          LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          USE_AGENT: 'false'
          AGENT_WORKSPACE: /workspace
          ANALYZE_URL: ${{ github.event.inputs.url }}
          BOT_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/analyze_url.py \
            --url "$ANALYZE_URL" \
            --bot-repo "$BOT_REPOSITORY" \
            --no-use-agent
