name: PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number
      focus:
        description: 'Specific areas to focus on (optional)'
        required: false
        default: ''
      no_post:
        description: 'Print to stdout only (do not post comment)'
        required: false
        default: 'false'
        type: boolean
      comment_id:
        description: 'Source comment ID (watcher dispatch)'
        required: false
        default: ''
      comment_author:
        description: 'Source comment author (watcher dispatch)'
        required: false
        default: ''

  repository_dispatch:
    types: [pr-review]

concurrency:
  group: pr-review-${{ github.event.client_payload.comment_id || github.event.inputs.comment_id || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: [self-hosted, amd-internal]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Review PR
        env:
          SGLANG_PAT: ${{ secrets.GH_PAT }}
          LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          LLM_GATEWAY_URL: ${{ secrets.LLM_GATEWAY_URL }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number || github.event.inputs.pr_number }}
          FOCUS: ${{ github.event.client_payload.focus || github.event.inputs.focus }}
          NO_POST: ${{ github.event.client_payload.no_post || github.event.inputs.no_post || 'false' }}
          COMMENT_AUTHOR: ${{ github.event.client_payload.comment_author || github.event.inputs.comment_author }}
          USE_AGENT: 'false'
          AGENT_WORKSPACE: /workspace
        run: |
          args=("$PR_NUMBER" --no-use-agent)
          if [ -n "$FOCUS" ]; then
            args+=(--focus "$FOCUS")
          fi
          if [ "$NO_POST" = "true" ]; then
            args+=(--no-post)
          fi
          python scripts/review_pr.py "${args[@]}"
